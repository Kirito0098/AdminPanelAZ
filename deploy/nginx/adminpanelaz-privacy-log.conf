# Mask portal / one-time download tokens in access logs (AdminPanelAZ).
map $request_uri $adminpanelaz_log_uri {
    ~*^(/p(?:/u)?/)[^/?#]+(.*)$ $1***$2;
    ~*^(.*/api/public/(?:qr-download|portal)/)[^/?#]+(.*)$ $1***$2;
    ~*^(.*/api/telegram/webhook/)[^/?#]+(.*)$ $1***$2;
    default $request_uri;
}

log_format adminpanelaz_privacy '$remote_addr - $remote_user [$time_local] '
    '"$request_method $adminpanelaz_log_uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
