# Cloudflare origin lock for panel locations (optional CLOUDFLARE_ORIGIN_LOCK).
# $adminpanelaz_cf_origin is keyed by the TCP peer ($realip_remote_addr), see
# conf.d/adminpanelaz-cloudflare-origin.conf (generated from cloudflare-origin-allow.conf).
# Plain allow/deny cannot be used here: realip rewrites the address before the access phase.

if ($adminpanelaz_cf_origin = 0) {
    return 403;
}
