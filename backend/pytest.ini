[pytest]
# Маркеры описываем здесь, чтобы pytest не ругался на неизвестные.
#   slow — тяжёлые файлы (auth-лимиты, ротация ключей, restore, tg-mini scope):
#          ~37 с из ~72 с полного набора. Итерации гоняем с `-m "not slow"`,
#          полный набор — перед релизом и крупными правками.
markers =
    slow: долгий файл, пропускается при -m "not slow"
