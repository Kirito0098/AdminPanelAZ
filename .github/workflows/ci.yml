name: CI

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*"]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check backend/ --output-format=github

      - name: Python compile check
        run: python -m compileall -q backend/app backend/node_agent

      - name: Import smoke test (panel + node agent)
        working-directory: backend
        env:
          NODE_AGENT_MODE: dev
        run: |
          PYTHONPATH=. python -c "from app.main import app; print('panel app import ok')"
          PYTHONPATH=. python -c "from node_agent.main import app as agent_app; print('node agent import ok')"

      - name: Pytest
        working-directory: backend
        env:
          NODE_AGENT_MODE: dev
        run: PYTHONPATH=. pytest tests/ -q --tb=short

      # PYSEC-2026-4146 (PyJWT): no fixed release; only hits decode with verify_signature=False, unused here.
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-4146

      - name: Bandit (security scan)
        run: bandit -c backend/bandit.yaml -r backend/app backend/node_agent -ll

  frontend:
    name: frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend (panel + tg-mini)
        working-directory: frontend
        run: npm run build:all

      - name: Charts stay out of the initial bundle
        working-directory: frontend
        run: npm run check:bundle

      # Метка сборки: по ней установщик и меню понимают, что интерфейс уже собран для этого коммита,
      # и не запускают npm на сервере. Тот же файл читает scripts/panel-frontend-deploy.sh.
      - name: Build info (для деплоя интерфейса из релиза)
        working-directory: frontend
        run: |
          node -e '
            const fs = require("node:fs");
            const { version } = require("./package.json");
            fs.writeFileSync("dist/.build-info.json", JSON.stringify({
              version,
              commit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF_NAME,
              node: process.version,
              built_at: new Date().toISOString(),
            }, null, 2) + "\n");
          '

      - name: Pack frontend build
        if: matrix.node == '22'
        run: tar czf "$RUNNER_TEMP/adminpanelaz-frontend.tar.gz" frontend/dist backend/app/static/tg_mini

      - name: Upload frontend build
        if: matrix.node == '22'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: ${{ runner.temp }}/adminpanelaz-frontend.tar.gz
          retention-days: 30

      # Build-only tooling (tailwindcss 3 → braces/micromatch) has unfixed advisories and never ships to the browser.
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # Релиз интерфейса: на тег vX.Y.Z кладём готовую сборку в GitHub Release, чтобы сервер без Node
  # (и без запаса RAM на vite) ставил её скриптом scripts/panel-frontend-deploy.sh.
  release:
    name: release frontend asset
    if: startsWith(github.ref, 'refs/tags/v')
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ${{ runner.temp }}

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="adminpanelaz-frontend-${GITHUB_REF_NAME}.tar.gz"
          mv "$RUNNER_TEMP/adminpanelaz-frontend.tar.gz" "$RUNNER_TEMP/$name"
          cd "$RUNNER_TEMP"
          sha256sum "$name" >"$name.sha256"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --notes "Сборка интерфейса панели и Mini App для $GITHUB_REF_NAME."
          gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  # Сборка по коммиту: установки обновляются по верхушке ветки, а не по тегу, поэтому готовый
  # интерфейс нужен на каждый push. Один pre-release «frontend-builds» с ассетами по sha,
  # старые ассеты удаляются — сервер качает ассет для своего HEAD (panel-frontend-deploy.sh --commit).
  frontend-builds:
    name: publish frontend build per commit
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ${{ runner.temp }}

      - name: Publish build asset
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_BUILDS: "20"
        run: |
          set -euo pipefail
          channel="frontend-builds"
          name="adminpanelaz-frontend-${GITHUB_SHA}.tar.gz"
          mv "$RUNNER_TEMP/adminpanelaz-frontend.tar.gz" "$RUNNER_TEMP/$name"
          cd "$RUNNER_TEMP"
          sha256sum "$name" >"$name.sha256"
          gh release view "$channel" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$channel" --repo "$GITHUB_REPOSITORY" --prerelease \
                 --target "$GITHUB_SHA" --title "frontend builds" \
                 --notes "Сборки интерфейса по коммитам: scripts/panel-frontend-deploy.sh --commit."
          gh release upload "$channel" "$name" "$name.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$channel" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets | sort_by(.createdAt) | reverse | .[].name' \
            | grep -E '\.tar\.gz$' | tail -n +"$((KEEP_BUILDS + 1))" \
            | while read -r old; do
                gh release delete-asset "$channel" "$old" --repo "$GITHUB_REPOSITORY" --yes
                gh release delete-asset "$channel" "$old.sha256" --repo "$GITHUB_REPOSITORY" --yes || true
              done || true

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck -S warning -x install.sh scripts/*.sh

      - name: Shell tests (all scripts/test-*.sh, host calls blocked)
        run: ./scripts/run-shell-tests.sh
